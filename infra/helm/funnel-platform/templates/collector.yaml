apiVersion: apps/v1
kind: Deployment
metadata: { name: fp-collector, labels: { app: fp-collector } }
spec:
  replicas: {{ .Values.collector.replicas }}
  selector: { matchLabels: { app: fp-collector } }
  template:
    metadata: { labels: { app: fp-collector } }
    spec:
      containers:
        - name: collector
          image: {{ include "fp.image" (dict "root" . "name" "collector") }}
          ports: [{ containerPort: 3100 }]
          envFrom: [{ secretRef: { name: {{ .Values.envFromSecret }} } }]
          readinessProbe: { httpGet: { path: /_t/readyz, port: 3100 }, periodSeconds: 5 }
          resources: {{- toYaml .Values.collector.resources | nindent 12 }}
          {{- include "fp.securityContext" . | nindent 10 }}
---
apiVersion: v1
kind: Service
metadata: { name: fp-collector }
spec: { selector: { app: fp-collector }, ports: [{ port: 3100, targetPort: 3100 }] }
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata: { name: fp-collector }
spec:
  scaleTargetRef: { apiVersion: apps/v1, kind: Deployment, name: fp-collector }
  minReplicas: {{ .Values.collector.hpa.minReplicas }}
  maxReplicas: {{ .Values.collector.hpa.maxReplicas }}
  metrics: [{ type: Resource, resource: { name: cpu, target: { type: Utilization, averageUtilization: {{ .Values.collector.hpa.cpu }} } } }]
