name: Release

# Tag vX.Y.Z -> build and push images -> deploy to staging -> (manual approval) -> production.
on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: read
  packages: write

jobs:
  images:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - { name: web, dockerfile: infra/docker/Dockerfile.web, target: runner, args: '' }
          - { name: migrator, dockerfile: infra/docker/Dockerfile.web, target: migrator, args: '' }
          - {
              name: collector,
              dockerfile: infra/docker/Dockerfile.node,
              target: '',
              args: 'APP=collector',
            }
          - {
              name: worker,
              dockerfile: infra/docker/Dockerfile.node,
              target: '',
              args: 'APP=worker',
            }
          - { name: postgres, dockerfile: infra/docker/Dockerfile.postgres, target: '', args: '' }
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          {
            registry: ghcr.io,
            username: '${{ github.actor }}',
            password: '${{ secrets.GITHUB_TOKEN }}',
          }
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          target: ${{ matrix.target }}
          build-args: |
            ${{ matrix.args }}
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/fp-${{ matrix.name }}:${{ github.ref_name }}
          labels: org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}
          provenance: true
          sbom: true

  deploy-staging:
    needs: [images]
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - uses: actions/checkout@v5
      - name: Deploy over SSH
        env: { SSH_KEY: '${{ secrets.STAGING_SSH_KEY }}', HOST: '${{ vars.STAGING_HOST }}' }
        run: |
          install -m 600 /dev/null ~/.ssh_key && echo "$SSH_KEY" > ~/.ssh_key
          ssh -i ~/.ssh_key -o StrictHostKeyChecking=accept-new deploy@"$HOST" \
            "cd /opt/fp && git fetch --tags && git checkout ${{ github.ref_name }} && TAG=${{ github.ref_name }} ./infra/scripts/deploy.sh"

  deploy-production:
    needs: [deploy-staging]
    runs-on: ubuntu-latest
    # Requires a reviewer in the GitHub "production" environment (approval gate).
    environment: production
    steps:
      - uses: actions/checkout@v5
      - name: Deploy over SSH
        env: { SSH_KEY: '${{ secrets.PRODUCTION_SSH_KEY }}', HOST: '${{ vars.PRODUCTION_HOST }}' }
        run: |
          install -m 600 /dev/null ~/.ssh_key && echo "$SSH_KEY" > ~/.ssh_key
          ssh -i ~/.ssh_key -o StrictHostKeyChecking=accept-new deploy@"$HOST" \
            "cd /opt/fp && git fetch --tags && git checkout ${{ github.ref_name }} && TAG=${{ github.ref_name }} ./infra/scripts/deploy.sh"
